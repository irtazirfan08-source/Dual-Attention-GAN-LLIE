name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy Pillow pytest

      - name: Run PyTest architecture & metric suite
        run: python -m pytest -v

      - name: Test Generator Forward Pass
        run: python infer.py -i "assets/dataset image.jpg.png" --device cpu --no-comparison